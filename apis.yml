name: Bop.fm
description: >-
  Bop.fm was a music-sharing and playlist startup that let people share and play
  individual songs across streaming services — building a link for a track that
  would resolve to whichever service (Spotify, Deezer, SoundCloud, YouTube, Rdio)
  each listener used. Founded out of Y Combinator, it reportedly reached several
  million monthly listeners and raised roughly $2M before being acquihired by
  identity-protection company LifeLock in October 2015, at which point the
  website, mobile apps, and embedded players were shut down. The company is
  defunct: the bop.fm domain no longer serves the product (it now redirects to an
  unrelated parked site) and no developer portal, documentation, or API surface
  remains online. This profile is retained as a historical record within the API
  Evangelist network; there are no live API artifacts to enrich.
